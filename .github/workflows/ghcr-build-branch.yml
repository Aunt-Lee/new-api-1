name: Publish GHCR image (manual branch)

# Build a GHCR image from an arbitrary branch via workflow_dispatch.
# Uses GITHUB_TOKEN (no extra secrets required). The image tag equals the
# branch name, e.g. building `rc51-custom` produces
# ghcr.io/<owner>/<repo>:rc51-custom.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build (tag will match this name)'
        required: true
        type: string

jobs:
  build:
    name: Build and push branch image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out requested branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Normalize GHCR repository
        run: echo "GHCR_REPOSITORY=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ env.GHCR_REPOSITORY }}:${{ inputs.branch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
